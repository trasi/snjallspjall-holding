<!doctype html>
<html lang="is">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Snjallspjall</title>
  <meta name="description" content="Snjallspjall er í hléi.">
  <meta name="theme-color" content="#3b82f6">
  <style>
    :root { --bg: #ffffff; --fg: #111827; --muted: #6b7280; --accent: #3b82f6; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #0b1220; --fg: #e5e7eb; --muted: #9ca3af; }
    }
    html, body { height: 100%; margin: 0; }
    body {
      display: grid; place-items: center; box-sizing: border-box; padding: 24px 16px;
      background: var(--bg); color: var(--fg);
      font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    main { max-width: 34rem; text-align: center; }
    .mark {
      width: 56px; height: 56px; border-radius: 16px; background: var(--accent);
      margin: 0 auto 24px; display: grid; place-items: center;
    }
    h1 { font-size: 1.75rem; margin: 0 0 .5rem; letter-spacing: -.01em; }
    p { margin: 0 0 1rem; color: var(--muted); }
    .en { font-size: .95rem; margin-top: 2rem; padding-top: 1.5rem; border-top: 1px solid rgba(128, 128, 128, .3); }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12a8 8 0 0 1-8 8H8l-5 3V12a8 8 0 0 1 8-8h2a8 8 0 0 1 8 8z"/>
      </svg>
    </div>
    <h1>Snjallspjall er í hléi</h1>
    <p>Þjónustan er ekki í rekstri í augnablikinu en gæti snúið aftur síðar.</p>
    <p class="en" lang="en">Snjallspjall is paused. The service is not running right now and may return in the future.</p>
  </main>
</body>
</html>
